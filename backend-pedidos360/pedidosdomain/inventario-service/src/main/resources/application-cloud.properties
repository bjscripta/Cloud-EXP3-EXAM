# Perfil exclusivo para RDS MySQL. H2 sigue siendo el modo local predeterminado.
# URL, usuario y contraseña se proporcionan desde el entorno; no guardar secretos aquí.
spring.datasource.url=${RDS_JDBC_URL}
spring.datasource.username=${RDS_DB_USER}
spring.datasource.password=${RDS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${RDS_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000
# Verificar tanto la cadena de confianza como el nombre del endpoint RDS.
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${RDS_TRUSTSTORE_URL:file:/app/certs/rds-truststore.p12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
# Solo contiene certificados públicos; no contiene claves privadas.
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
