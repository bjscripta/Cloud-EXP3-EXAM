spring.application.name=clientes-service
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/clientesdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Los datos demo se cargan explícitamente desde administración.
spring.sql.init.mode=never

# Evitar truncar cantidades o identificadores decimales al convertir a enteros.
spring.jackson.deserialization.accept-float-as-int=false
