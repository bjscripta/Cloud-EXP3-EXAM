spring.application.name=pedidos-service
server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

# Kafka: microservicio en el host; sobrescribir para contenedores.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092}
spring.kafka.client-id=${spring.application.name}
spring.kafka.security.protocol=PLAINTEXT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.in.flight.requests.per.connection]=5
spring.kafka.producer.properties[delivery.timeout.ms]=120000
spring.kafka.producer.properties[request.timeout.ms]=30000
# Contratos JSON compartidos; el consumidor definirá explícitamente su DTO.
spring.kafka.producer.properties[spring.json.add.type.headers]=false
# Los tópicos se administran con Compose y el futuro administrador Kafka.
spring.kafka.admin.auto-create=false
app.kafka.topics.pedidos=${KAFKA_TOPIC_PEDIDOS:pedidos-eventos}

# La outbox no bloquea el request HTTP cuando Kafka está caído.
spring.kafka.producer.properties[max.block.ms]=5000
app.kafka.outbox.poll-delay-ms=${KAFKA_OUTBOX_POLL_DELAY_MS:1000}
# Archivo local para conservar negocio y outbox entre reinicios (override en cloud).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pedidosdb;DB_CLOSE_ON_EXIT=FALSE}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Evitar truncar cantidades o identificadores decimales al convertir a enteros.
spring.jackson.deserialization.accept-float-as-int=false
