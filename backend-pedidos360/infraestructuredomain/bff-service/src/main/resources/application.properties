spring.application.name=bff-service
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/db3843d7-97a9-4e1a-9177-d8840f212cc5/v2.0

app.security.audience=a241b144-f113-40f9-a46d-f9b3f6d9b098
app.security.cors.allowed-origins=http://localhost:4200

# Servicios internos para las vistas de analítica y administración Kafka.
app.services.analitica-url=${ANALITICA_SERVICE_URL:http://127.0.0.1:8088}
app.services.kafka-admin-url=${KAFKA_ADMIN_SERVICE_URL:http://127.0.0.1:8091}

# Solo se cargan los cinco conjuntos demo al pulsar el botón de administración.
app.demo.enabled=${ENABLE_DEMO_DATA:true}
