<header class="topbar">
  <a class="brand" routerLink="/">Pedidos360</a>
  @if (isAuthenticated()) {
    <nav aria-label="Navegación principal">
      <a routerLink="/clientes" routerLinkActive="active" ariaCurrentWhenActive="page">Clientes</a>
      <a routerLink="/analitica" routerLinkActive="active" ariaCurrentWhenActive="page">Analítica</a>
      <a routerLink="/kafka" routerLinkActive="active" ariaCurrentWhenActive="page">Kafka</a>
    </nav>
    <span>{{ accountName() }}</span>
    <button type="button" (click)="logout()">Cerrar sesión</button>
  }
</header>
<main><router-outlet /></main>
